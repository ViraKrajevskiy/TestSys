<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TestSys</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/randomizer-v2.css">
</head>
<body>

<div id="app-root" class="d-flex flex-column">

  <!-- Верхняя панель как в браузере -->
  <header id="app-navbar" class="d-flex align-items-center">
    <span class="brand navbar-brand">Test<span class="brand-accent">Sys</span></span>
    <button id="sidebar-toggle-btn" class="nav-bar-btn" data-i18n-title="navSidebar" title="Свернуть/развернуть коллекции">
      <i class="bi bi-layout-sidebar"></i>
    </button>
    <div class="navbar-spacer flex-grow-1"></div>
    <button id="return-to-main-btn" class="nav-bar-btn" data-i18n-title="navReturn" title="Вернуть вкладку в главное окно" style="display:none;">
      <i class="bi bi-box-arrow-in-left"></i>
    </button>
    <button id="data-generator-btn" class="nav-bar-btn" data-i18n-title="navGenerator" title="Генератор тестовых данных" onclick="Generator.showModal()">
      <i class="bi bi-shuffle"></i>
    </button>
    <button id="randomizer-btn" class="nav-bar-btn" data-i18n-title="navRandomizer" title="Рандомайзер" onclick="UnifiedRandomizer.toggle()">
      <i class="bi bi-dice-5"></i>
    </button>
    <button id="users-btn" class="nav-bar-btn" data-i18n-title="navUsers" title="Управление пользователями" onclick="App.openUsersTab()">
      <i class="bi bi-people"></i>
    </button>
    <button id="theme-settings-btn" class="nav-bar-btn" data-i18n-title="navTheme" title="Настроить тему">
      <i class="bi bi-palette"></i>
    </button>
    <button id="sync-btn" class="nav-bar-btn" data-i18n-title="navSync" title="Совместная работа">
      <i class="bi bi-hdd"></i>
    </button>
    <button id="metrics-btn" class="nav-bar-btn" data-i18n-title="navMetrics" title="Метрики запросов">
      <i class="bi bi-graph-up"></i>
    </button>
    <button id="settings-btn" class="nav-bar-btn" data-i18n-title="navSettings" title="Настройки проекта">
      <i class="bi bi-gear"></i>
    </button>
  </header>

  <div class="app-body d-flex flex-grow-1">

  <!-- ==================== SIDEBAR: коллекции ==================== -->
  <aside id="sidebar">
    <div class="sidebar-header px-3 pt-3 pb-2">
      <div class="sidebar-section-title mb-0" data-i18n="collections">Коллекции</div>
    </div>
    <div class="px-2">
      <div id="collections-tree"></div>
    </div>
    <div id="sidebar-resize-handle"></div>
  </aside>

  <!-- ==================== ОСНОВНАЯ ОБЛАСТЬ ==================== -->
  <main class="flex-grow-1 d-flex flex-column main-area">

    <!-- Полоса вкладок -->
    <div id="tab-bar" class="d-flex align-items-center">
      <div id="tabs-container" class="d-flex flex-grow-1"></div>
      <button id="add-tab-btn" class="tab-bar-btn" data-i18n-title="newTab" title="Новая вкладка (Ctrl+T)">
        <i class="bi bi-plus-lg"></i>
      </button>
      <button id="close-all-btn" class="tab-bar-btn tab-bar-btn-danger" data-i18n-title="closeAllTabs" title="Закрыть все вкладки">
        <i class="bi bi-x-square"></i>
      </button>
    </div>

    <!-- Содержимое активной вкладки -->
    <div id="tab-content" class="flex-grow-1"></div>

  </main>
  </div>
</div>

<!-- Кастомное контекстное меню для вкладок -->
<ul id="tab-context-menu" class="dropdown-menu">
  <li><button class="dropdown-item" data-action="rename" data-i18n="renameTab">
    <i class="bi bi-pencil me-1"></i> Переименовать
  </button></li>
  <li><hr class="dropdown-divider"></li>
  <li><button class="dropdown-item" data-action="close" data-i18n="closeTab">Закрыть вкладку</button></li>
  <li><button class="dropdown-item" data-action="close-others" data-i18n="closeOthers">Закрыть остальные</button></li>
  <li><button class="dropdown-item" data-action="close-all" data-i18n="closeAllTabs">Закрыть все вкладки</button></li>
  <li><hr class="dropdown-divider"></li>
  <li><button class="dropdown-item" data-action="detach" data-i18n="openInWindow">
    <i class="bi bi-box-arrow-up-right me-1"></i> Открыть в отдельном окне
  </button></li>
</ul>

<!-- Шаблон одной вкладки в полосе (клонируется через JS) -->
<template id="tab-pill-template">
  <div class="tab-pill">
    <span class="method-dot"></span>
    <span class="tab-title"></span>
    <button class="tab-detach-btn" title="Открыть в отдельном окне"><i class="bi bi-box-arrow-up-right"></i></button>
    <button class="tab-close-btn" title="Закрыть"><i class="bi bi-x"></i></button>
  </div>
</template>

<!-- Шаблон строки key-value для Params/Headers -->
<template id="kv-row-template">
  <div class="kv-row d-flex gap-2 mb-2">
    <input type="text" class="form-control form-control-sm kv-key" placeholder="Key">
    <input type="text" class="form-control form-control-sm kv-value" placeholder="Value">
    <button class="btn btn-sm btn-outline-secondary kv-remove" title="Удалить"><i class="bi bi-trash3"></i></button>
  </div>
</template>

<!-- Плавающее hover-превью (карточки коллекций / вкладки) -->
<div id="hover-preview" class="hover-preview"></div>

<!-- Модалка настройки темы -->
<div class="modal fade" id="theme-modal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content theme-modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Настройка темы</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <!-- Preset buttons -->
        <div class="mb-3">
          <label class="form-label" style="font-size:0.78rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.05em;">Готовые темы</label>
          <div class="d-flex gap-2 flex-wrap">
            <button class="btn btn-sm btn-outline-secondary" data-theme-preset="dark">Dark</button>
            <button class="btn btn-sm btn-outline-secondary" data-theme-preset="light">Light</button>
            <button class="btn btn-sm btn-outline-secondary" data-theme-preset="midnight">Midnight</button>
            <button class="btn btn-sm btn-outline-secondary" data-theme-preset="green">Matrix</button>
          </div>
        </div>
        <hr style="border-color:var(--border-color);">
        <div class="theme-field">
          <label>Акцентный цвет</label>
          <input type="color" id="theme-accent" class="form-control form-control-color">
        </div>
        <div class="theme-field">
          <label>Фон приложения</label>
          <input type="color" id="theme-bg-app" class="form-control form-control-color">
        </div>
        <div class="theme-field">
          <label>Фон панелей</label>
          <input type="color" id="theme-bg-panel" class="form-control form-control-color">
        </div>
        <div class="theme-field">
          <label>Фон полей ввода</label>
          <input type="color" id="theme-bg-input" class="form-control form-control-color">
        </div>
        <div class="theme-field">
          <label>Основной текст</label>
          <input type="color" id="theme-text" class="form-control form-control-color">
        </div>
        <div class="theme-field">
          <label>Приглушённый текст</label>
          <input type="color" id="theme-text-dim" class="form-control form-control-color">
        </div>
        <div class="theme-field">
          <label>Границы</label>
          <input type="color" id="theme-border" class="form-control form-control-color">
        </div>
        <div class="theme-field">
          <label>Скругление углов: <span id="theme-radius-value">8</span>px</label>
          <input type="range" id="theme-radius" class="form-range" min="0" max="20" step="1">
        </div>
        <div class="theme-field">
          <label>Размер шрифта: <span id="theme-fontsize-value">14</span>px</label>
          <input type="range" id="theme-fontsize" class="form-range" min="11" max="18" step="1">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" id="theme-reset-btn">Сбросить</button>
        <button type="button" class="btn send-btn" id="theme-save-btn">Сохранить</button>
      </div>
    </div>
  </div>
</div>

<!-- Модалка Create / Edit сущности -->
<div class="modal fade" id="entity-modal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content theme-modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="entity-modal-title">Entity</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="entity-form-fields"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn send-btn" id="entity-save-btn">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- Модалка подтверждения удаления -->
<div class="modal fade" id="delete-modal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content theme-modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Confirm Delete</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p id="delete-confirm-text" class="mb-0"></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" id="delete-confirm-btn">Delete</button>
      </div>
    </div>
  </div>
</div>

<!-- Модалка генератора данных строится в js/features/dataGenerator.js.
     Статическая копия удалена: её id (gen-form-fields, gen-notification)
     дублировали динамическую, из-за чего getElementById попадал не в то окно. -->

<!-- crossorigin — чтобы ошибки из CDN-скрипта не превращались в безликое "Script error." -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script src="js/core/i18n.js"></script>
<script src="js/core/logger.js"></script>
<script src="js/core/dialogs.js"></script>
<script src="js/core/dynamicVars.js"></script>
<script src="js/core/swagger.js"></script>
<script src="js/core/state.js"></script>
<script src="js/core/utils.js"></script>
<script src="js/core/preview.js"></script>
<script src="js/features/tabs.js"></script>
<script src="js/features/request.js"></script>
<script src="js/features/crud.js"></script>
<script src="js/features/dynamicVarsUI.js"></script>
<script src="js/features/swaggerUI.js"></script>
<script src="js/features/updater.js"></script>
<script src="js/features/logViewer.js"></script>
<script src="js/features/metrics.js"></script>
<script src="js/features/settings.js"></script>
<script src="js/features/sync.js"></script>
<script src="js/features/syncUI.js"></script>
<script src="js/features/resize.js"></script>
<script src="js/features/theme.js"></script>
<script src="js/features/detached.js"></script>
<script src="js/features/contextMenu.js"></script>
<script src="js/features/users.js"></script>
<script src="js/features/dataGenerator.js"></script>
<script src="js/components/tabBar.js"></script>
<script src="js/components/tabContent.js"></script>
<script src="js/components/collections.js"></script>
<script src="js/features/randomizer-unified.js"></script>
<script src="js/main.js"></script>
</body>
</html>
